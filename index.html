<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>G.M.S Reparing Stock Entry</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body,
        html {
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            background-color: #f4f7f6;
            font-family: 'Segoe UI', sans-serif;
        }

        .navbar {
            background: #ffffff;
            border-bottom: 1px solid #dee2e6;
            flex-shrink: 0;
        }

        /* Page တစ်ခုလုံးကို Scroll ဖြစ်အောင် ပြင်ထားခြင်း (Form အပေါ်ပိုင်း မပျောက်တော့ပါ) */
        .main-content {
            flex-grow: 1;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 20px 10px;
            overflow-y: visible; 
        }

        .card-pro {
            background: white;
            padding: 15px 20px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 400px;
        }

        .form-label {
            font-weight: 700;
            font-size: 0.7rem;
            color: #444;
            margin-bottom: 1px;
            text-transform: uppercase;
        }

        .form-control {
            border-radius: 6px;
            padding: 6px 10px;
            border: 1px solid #d1d9e0;
            margin-bottom: 8px;
            font-size: 0.85rem;
            text-transform: uppercase;
            -moz-appearance: textfield;
            appearance: none;
        }
        
        .form-control::-webkit-outer-spin-button,
        .form-control::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        /* အဝိုင်းပုံစံ ခလုတ်အတွက် CSS */
        .btn-circle {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
            margin: 0 auto;
        }

        .btn-submit {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: 700;
            width: 100%;
            transition: 0.3s;
            margin-top: 5px;
            font-size: 0.9rem;
        }

        footer {
            flex-shrink: 0;
            background: #ffffff;
            text-align: center;
            padding: 10px;
            font-size: 0.7rem;
            color: #888;
            border-top: 1px solid #dee2e6;
        }

        #loginOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #f8f9fa;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>

<body>

    <div id="loginOverlay">
        <div class="card-pro text-center" style="width: 300px;">
            <h6 class="mb-3 fw-bold">🔐 G.M.S CORPORATION</h6>
            <input type="password" id="passInput" class="form-control text-center" placeholder="PASSWORD">
            <button class="btn btn-primary btn-submit" onclick="checkLogin()">LOGIN</button>
            <p id="loginError" class="text-danger mt-2" style="display:none; font-size: 11px;">Invalid Password</p>
        </div>
    </div>

    <nav class="navbar">
        <div class="container-fluid">
            <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#mainMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <span class="navbar-brand mb-0 h1 text-primary mx-auto fw-bold" style="font-size: 0.9rem;">G.M.S STOCK SYSTEM</span>
        </div>
    </nav>

    <div class="offcanvas offcanvas-start" id="mainMenu">
        <div class="offcanvas-header border-bottom">
            <h6 class="fw-bold m-0">MENU BAR</h6>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body p-0">
            <div class="list-group list-group-flush">
                <a href="index.html" class="list-group-item list-group-item-action p-3 active">🏠 SPARE PARTS ENTRY</a>
                <a href="history.html" class="list-group-item list-group-item-action p-3">📊 HISTORY DASHBOARD</a>
                <a href="packing.html" class="list-group-item list-group-item-action p-3">📦 PACKING DASHBOARD</a>
                <a href="kpi.html" class="list-group-item list-group-item-action p-3">📈 KPI DASHBOARD</a>
                <a href="incoming.html" class="list-group-item list-group-item-action p-3">📥 STOCK INCOMING</a>
                <button class="list-group-item list-group-item-action p-3 text-danger fw-bold" onclick="logout()">LOGOUT</button>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="card-pro">
            <h6 class="text-center mb-3 fw-bold text-dark border-bottom pb-1" style="font-size: 0.85rem;">REPAIR ENTRY FORM</h6>
            <form id="repairForm">
                
                <!-- Entry Date နှင့် CLA No -->
                <div class="row g-2">
                    <div class="col-6">
                        <label class="form-label">Entry Date</label>
                        <input type="date" id="entry_date" class="form-control" required>
                    </div>
                    <div class="col-6">
                        <label class="form-label">CLA No.</label>
                        <input type="text" id="cla_no" class="form-control" placeholder="CLA26-000000" required>
                    </div>
                </div>

                <div class="row g-2">
                    <div class="col-6">
                        <label class="form-label">Technician</label>
                        <input type="text" id="tech_name" placeholder="NAME" class="form-control" required>
                    </div>
                    <div class="col-6">
                        <label class="form-label">Item Code</label>
                        <input type="text" id="item_code" placeholder="CODE" class="form-control" required>
                    </div>
                </div>

                <label class="form-label">Model</label>
                <input type="text" id="model" placeholder="MODEL NAME" class="form-control" required>

                <!-- Multiple Parts Container (Circular Button) -->
                <div id="partsContainer">
                    <div class="row g-2 align-items-center part-row mb-1">
                        <div class="col-7">
                            <label class="form-label">Replaced Part</label>
                            <input type="text" name="part[]" class="form-control mb-0" placeholder="PART NAME">
                        </div>
                        <div class="col-3">
                            <label class="form-label">Qty</label>
                            <input type="number" name="qty[]" class="form-control mb-0" min="0" placeholder="0">
                        </div>
                        <div class="col-2 text-center">
                            <label class="form-label">&nbsp;</label>
                            <button type="button" class="btn btn-outline-primary btn-circle" onclick="addPartRow()" title="Add Part">+</button>
                        </div>
                    </div>
                </div>

                <div class="row g-2 mt-1">
                    <div class="col-8">
                        <label class="form-label">Packing Type</label>
                        <input type="text" id="packing" class="form-control" value="PACKING" readonly>
                    </div>
                    <div class="col-4">
                        <label class="form-label">P.Qty</label>
                        <input type="number" id="p_qty" class="form-control" min="0" placeholder="0">
                    </div>
                </div>

                <!-- Status Type (တစ်ခုတည်းသာ Select လုပ်လို့ရသော Checkboxes / Radio ပုံစံ) -->
                <div class="mb-2 p-2 bg-light border rounded">
                    <label class="form-label text-primary d-block mb-1">Status Type (Select One)</label>
                    <div class="d-flex flex-wrap gap-2 justify-content-between" style="font-size: 0.75rem; font-weight: 600;">
                        <div class="form-check">
                            <input class="form-check-input status-chk" type="checkbox" value="ADD STOCK" id="chk_add" onclick="onlyOne(this)">
                            <label class="form-check-label" for="chk_add">Add Stock</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input status-chk" type="checkbox" value="PACKING DAMAGE" id="chk_packing_dmg" onclick="onlyOne(this)">
                            <label class="form-check-label" for="chk_packing_dmg">Packing Dmg</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input status-chk" type="checkbox" value="GOODS DAMAGE" id="chk_goods_dmg" onclick="onlyOne(this)">
                            <label class="form-check-label" for="chk_goods_dmg">Not Good</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input status-chk" type="checkbox" value="CN" id="chk_cn" onclick="onlyOne(this)">
                            <label class="form-check-label" for="chk_cn">CN</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input status-chk" type="checkbox" value="PENDING" id="chk_pending" onclick="onlyOne(this)">
                            <label class="form-check-label" for="chk_pending">Pending</label>
                        </div>
                    </div>
                </div>

                <div class="row g-2">
                    <div class="col-6">
                        <label class="form-label">Repair Hour</label>
                        <input type="number" id="repair_hour" class="form-control" placeholder="HOUR" min="0">
                    </div>
                    <div class="col-6">
                        <label class="form-label">Repair Min</label>
                        <input type="number" id="repair_min" class="form-control" placeholder="MINUTE" min="0" max="59">
                    </div>
                </div>

                <label class="form-label">Note</label>
                <input type="text" id="note" class="form-control" placeholder="OPTIONAL">

                <button type="submit" id="submitBtn" class="btn-submit">SAVE RECORD</button>
            </form>
            <div id="status" class="mt-1 text-center fw-bold" style="font-size: 0.75rem; min-height: 18px;"></div>
        </div>
    </div>

    <footer>
        <div>© 2026 G.M.S CO.,LTD. | BUILT BY RAHUL & GEMINI AI</div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
    <script>
        // Checkbox များကို တစ်ခုတည်းသာ ခြစ်လို့ရအောင် ထိန်းချုပ်သည့် Function
        function onlyOne(checkbox) {
            document.querySelectorAll('.status-chk').forEach((item) => {
                if (item !== checkbox) item.checked = false;
            });
        }

        window.onload = () => {
            document.getElementById('entry_date').value = new Date().toISOString().split('T')[0];
            if (localStorage.getItem('isLoggedIn') === 'true') document.getElementById('loginOverlay').style.display = 'none';
        };
        function checkLogin() {
            if (document.getElementById('passInput').value === "GMS12092022") {
                localStorage.setItem('isLoggedIn', 'true');
                document.getElementById('loginOverlay').style.display = 'none';
            } else { document.getElementById('loginError').style.display = 'block'; }
        }
        function logout() { localStorage.removeItem('isLoggedIn'); window.location.reload(); }
    </script>
</body>

</html>
